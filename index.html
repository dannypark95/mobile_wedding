<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve to anything
         other than 0 on notched iPhones. No user-scalable=no: guests need to pinch-zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Without this, iOS Safari renders the account numbers as blue tel: links. -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <title>박성현 ♥ 배예은 결혼합니다</title>
    <meta name="description" content="2026. 10. 24 토요일 오후 2:30 · 부산 센텀호텔" />
    <meta name="theme-color" content="#ffffff" />

    <!-- The S·Y monogram. The SVG carries its letterforms as outlines rather than a font
         reference, so it needs no webfont and stays crisp at every size a tab or bookmark
         asks for; the PNG is the fallback for browsers that will not take an SVG favicon.
         apple-touch-icon is a separate, full-bleed file because iOS rounds the corners
         itself — handing it the already-rounded artwork rounds them twice. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="180x180" href="/icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="박성현 ♥ 배예은 결혼합니다" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="박성현 ♥ 배예은 결혼합니다" />
    <meta property="og:description" content="2026. 10. 24 토요일 오후 2:30 · 부산 센텀호텔" />
    <meta property="og:image" content="https://sunghyunyeeun.com/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://sunghyunyeeun.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="박성현 ♥ 배예은 결혼합니다" />
    <meta name="twitter:description" content="2026. 10. 24 토요일 오후 2:30 · 부산 센텀호텔" />
    <meta name="twitter:image" content="https://sunghyunyeeun.com/preview.png" />

    <!-- The hero photo cannot be requested until the settings document says which photo is
         current, so the DNS + TLS cost of these two hosts sits directly on the critical path.
         Paying it here, in parallel with the bundle download, is the difference between the
         hero appearing at once and appearing a beat late. The crossorigin split is deliberate:
         the settings document arrives over a CORS fetch (anonymous connection pool), the photo
         over a plain img element (credentialed pool), and a mismatched hint just opens a
         second connection and warms nothing. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" />

    <!-- Nanum Myeongjo is the only webfont the design actually uses. It was previously
         pulled in via an @import inside the bundled CSS, which forced the browser to
         download and parse that CSS before it could even discover the font. Loading it
         here lets the preconnects above do their job. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
